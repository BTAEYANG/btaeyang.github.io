<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <defs>
    <filter id="fur" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26"/>
    </filter>
    <radialGradient id="face" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#FBF0D9"/>
      <stop offset="100%" stop-color="#F3E3C2"/>
    </radialGradient>
  </defs>
  <rect width="720" height="720" fill="#FFFFFF"/>
  <!-- fluffy cream body -->
  <g filter="url(#fur)">
    <ellipse cx="360" cy="415" rx="218" ry="265" fill="#EADFC6"/>
    <ellipse cx="148" cy="480" rx="52" ry="120" fill="#EADFC6" transform="rotate(14 148 480)"/>
    <ellipse cx="572" cy="480" rx="52" ry="120" fill="#EADFC6" transform="rotate(-14 572 480)"/>
  </g>
  <!-- smooth face plate -->
  <rect x="205" y="165" width="310" height="245" rx="118" fill="url(#face)"/>
  <!-- blush -->
  <ellipse cx="262" cy="322" rx="30" ry="16" fill="#F2B49C" opacity="0.55"/>
  <ellipse cx="458" cy="322" rx="30" ry="16" fill="#F2B49C" opacity="0.55"/>
  <!-- eyes -->
  <circle cx="302" cy="292" r="19" fill="#141414"/>
  <circle cx="418" cy="292" r="19" fill="#141414"/>
  <circle cx="309" cy="285" r="6" fill="#FFFFFF"/>
  <circle cx="425" cy="285" r="6" fill="#FFFFFF"/>
  <!-- smile -->
  <path d="M332 338 Q360 360 388 338" fill="none" stroke="#2B2B2B" stroke-width="7" stroke-linecap="round"/>
</svg>
